version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
  - package-ecosystem: npm
    # Root of the npm workspace (shared/, gateway/, pwa/): one lockfile.
    directory: /
    schedule: { interval: weekly }
    groups:
      dev-dependencies:
        dependency-type: development
  - package-ecosystem: docker
    directory: /
    schedule: { interval: weekly }
