name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Include what you expected to happen.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. ...\n2. ...\n3. ..."
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Image tag / commit
      placeholder: "ghcr.io/thanhhvnqb/pxdict:wudict-v3.7.11"
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [PWA, Gateway, Admin, Deployment, CI, Other]
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Remove tokens, passwords and cookies before pasting.
      render: shell
