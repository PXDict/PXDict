name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typescript:
    name: TypeScript (shared, gateway, PWA)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Generated wuDict types are up to date
        run: npm run gen:api -- --check
      - name: Better Auth schema matches its plugins and version
        run: node gateway/scripts/gen-auth-schema.mjs --check
      - name: Database migrations match the schema
        run: |
          npm run db:generate -w @pxdict/gateway
          git status --porcelain gateway/drizzle
          test -z "$(git status --porcelain gateway/drizzle)"
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  contract:
    name: Contract tests (real wuDict)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Read the pinned wuDict tag
        id: pin
        run: echo "version=$(tr -d '[:space:]' < WUDICT_VERSION)" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/build-wudict
        id: wudict
        with:
          version: ${{ steps.pin.outputs.version }}
      - run: npm ci
      - name: Contract tests
        run: npm test -w @pxdict/gateway -- contract
        env:
          WUDICT_BIN: ${{ steps.wudict.outputs.bin }}

  image:
    name: Image build + smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: pxdict:dev
          build-args: |
            PXDICT_VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - run: scripts/smoke-test.sh pxdict:dev

  scripts:
    name: Shell scripts and pins
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: shellcheck
        run: shellcheck scripts/*.sh scripts/spike/*.sh docker/entrypoint.sh
      - name: Dockerfile default wuDict version equals WUDICT_VERSION
        run: |
          want="$(tr -d '[:space:]' < WUDICT_VERSION)"
          count="$(grep -c "^ARG WUDICT_VERSION=${want}\$" Dockerfile)"
          test "$count" -eq "$(grep -c '^ARG WUDICT_VERSION=' Dockerfile)" || {
            echo "Dockerfile ARG WUDICT_VERSION defaults must all be ${want}" >&2
            exit 1
          }
      - name: Dockerfile build and runtime stages use the same Node.js image
        run: |
          test "$(grep -E '^FROM .*node:' Dockerfile | sed -E 's/.*(node:[^ ]+).*/\1/' | sort -u | wc -l)" -eq 1 || {
            echo "Dockerfile node:* base images differ between stages" >&2
            exit 1
          }
